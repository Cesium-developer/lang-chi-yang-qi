name: Build solver

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Compile final solver programs
        run: cargo build --release --locked --bins

      - name: Assemble downloadable tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/solver
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp target/release/retro5.exe build/solver/
            cp target/release/retro_dtm_exact.exe build/solver/
            cp target/release/verify.exe build/solver/
          else
            cp target/release/retro5 build/solver/
            cp target/release/retro_dtm_exact build/solver/
            cp target/release/verify build/solver/
          fi
          cp solver_rs/table_storage.py solver_rs/compress_dtm.py build/solver/

      - name: Upload compiled tools
        uses: actions/upload-artifact@v7
        with:
          name: compiled-tools-${{ matrix.os }}
          path: build/solver/
          if-no-files-found: error
          compression-level: 0

  attach-tools:
    name: Attach compiled tools to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download built tools
        uses: actions/download-artifact@v7
        with:
          path: tools
          pattern: compiled-tools-*

      - name: Package each platform
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cd tools
          for d in */; do
            n="${d%/}"
            ( cd "$n" && zip -qr "$GITHUB_WORKSPACE/dist/${n}.zip" . )
          done
          ls -la "$GITHUB_WORKSPACE/dist"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/dist"
          ls -la
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --notes "Compiled solver tools for $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" ./*.zip \
            --repo "$GITHUB_REPOSITORY" --clobber
